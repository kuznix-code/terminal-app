name: Build

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential meson ninja-build pkg-config qt6-base-dev
      - name: Configure
        run: meson setup build
      - name: Build
        run: meson compile -C build
      - name: Smoke test binary
        run: test -x build/kuznix-terminal
